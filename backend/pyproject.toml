# Nya-AI backend: the FastAPI app, the law library (RAG) and the LangGraph agents in one package, `app`.
[project]
name = "nya-ai-backend"
version = "0.1.0"
description = "Nya-AI backend: API, law library and legal agents for Indian law"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0.55",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "razorpay>=1.4.0",
    # Agents, law library and observability
    "langfuse>=5.0.4",
    "langgraph>=1.2.18",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-azure-openai>=0.6.1",
    "llama-index-readers-file>=0.7.0",
    "llama-index-storage-docstore-postgres>=0.6.0",
    "llama-index-storage-kvstore-postgres>=0.4",
    "llama-index-vector-stores-postgres>=0.9.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.4",
    "langgraph-checkpoint-sqlite>=3.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
nya-agent = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pylint>=3.3.0",
    "openpyxl>=3.1.5",
]
eval = [
    "langchain-community<0.4",
    "ragas>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

# Static analysis (NIIT rule 1): `uv run ruff check .` and `uv run pylint app`.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PL"]
ignore = [
    "B008",     # FastAPI's Depends()/Query() in defaults is the framework's pattern
    "PLR0911",  # many returns: the CLI and the parser read better flat
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",  # magic numbers: legal section numbers and HTTP codes are literal by nature
    "PLR0917",
    "PLC0415",  # the CLI and services import heavy modules lazily on purpose
    "C408",     # dict(...) calls are kept where they read better than literals
]

[tool.pylint.main]
py-version = "3.12"
jobs = 0
ignore-paths = ["^data/.*$"]
load-plugins = ["pylint.extensions.docparams"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "missing-function-docstring",  # docstrings where they add something, not on every handler
    "missing-class-docstring",     # Pydantic and SQLAlchemy models are self-describing
    "too-few-public-methods",      # Pydantic models
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-statements",
    "import-outside-toplevel",     # the CLI imports heavy modules lazily on purpose
    "duplicate-code",
    "use-dict-literal",            # matches Ruff's C408 choice
]

[tool.pylint.typecheck]
generated-members = ["order", "utility"]  # razorpay.Client attaches these at runtime

[tool.pylint.basic]
good-names = ["SessionLocal", "db", "e", "i", "k", "n", "r", "s", "_"]

[tool.pylint.design]
max-attributes = 12
